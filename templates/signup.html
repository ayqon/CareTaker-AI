{% extends "base.html" %}

{% block title %}CareTaker - Sign Up{% endblock %}

{% block content %}
<main class="max-w-md mx-auto mt-16 p-6 bg-white rounded-lg shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

  <form method="POST" action="/signup" class="space-y-4">
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <input type="text" id="username" name="username" required
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input type="password" id="password" name="password" required
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
      <select id="role" name="role" required
        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="" disabled selected>Select a role</option>
        <option value="worker">Worker</option>
        <option value="supervisor">Supervisor</option>
      </select>
    </div>

    <div id="worker-fields" class="hidden space-y-4">
      <div>
        <label for="preferred_language" class="block text-sm font-medium text-gray-700 mb-1">Preferred Language</label>
        <select id="preferred_language" name="preferred_language"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="hi">Hindi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="bn">Bengali</option>
          <option value="mr">Marathi</option>
          <option value="gu">Gujarati</option>
          <option value="kn">Kannada</option>
          <option value="ml">Malayalam</option>
          <option value="fr">French</option>
          <option value="ar">Arabic</option>
          <option value="pt">Portuguese</option>
          <option value="zh">Chinese (Mandarin)</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="de">German</option>
          <option value="ru">Russian</option>
          <option value="it">Italian</option>
          <option value="tr">Turkish</option>
          <option value="vi">Vietnamese</option>
          <option value="id">Indonesian</option>
          <option value="th">Thai</option>
          <option value="nl">Dutch</option>
          <option value="pl">Polish</option>
        </select>
      </div>

      <div>
        <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
        <input type="number" id="age" name="age" min="16" max="100"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
        <select id="gender" name="gender"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">Prefer not to say</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <button type="submit"
      class="w-full py-2 bg-green-500 hover:bg-green-600 text-white font-semibold rounded">
      Create Account
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-gray-600">
    Already have an account?
    <a href="/" class="text-blue-500 hover:underline">Login</a>
  </p>
</main>

<script>
  document.getElementById('role').addEventListener('change', function() {
    const workerFields = document.getElementById('worker-fields');
    if (this.value === 'worker') {
      workerFields.classList.remove('hidden');
    } else {
      workerFields.classList.add('hidden');
    }
  });
</script>
{% endblock %}
